name: Coleta SIPEAGRO

on:
  schedule:
    - cron: "37 9 * * 1"   # toda segunda às 06h37 (Brasília); a fonte é semanal
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Baixar e processar o SIPEAGRO
        run: python coleta_sipeagro.py
      - name: Gravar o resultado no repositório
        run: |
          git config user.name "coleta-sipeagro"
          git config user.email "coleta-sipeagro@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet && exit 0
          git commit -m "SIPEAGRO: coleta de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
