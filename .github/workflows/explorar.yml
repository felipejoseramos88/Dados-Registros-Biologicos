name: Explorar fontes
on:
  workflow_dispatch: {}
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl xlrd
      - run: python ferramentas/explorar.py
