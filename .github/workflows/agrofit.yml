name: Coleta Agrofit

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06h17 (Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Baixar e processar o Agrofit
        run: python coleta_agrofit.py
      - name: Gravar o resultado no repositório
        run: |
          git config user.name "coleta-agrofit"
          git config user.email "coleta-agrofit@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet && exit 0
          git commit -m "Agrofit: coleta de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
